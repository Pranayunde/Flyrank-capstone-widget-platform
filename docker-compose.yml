services:
  postgres:
    image: postgres:16
    container_name: flyrank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank_password
      POSTGRES_DB: flyrank
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: